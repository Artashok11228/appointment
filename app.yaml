kind: wasmer.io/App.v0
name: appointment
owner: iliashoky2022
package: .
app_id: da_K0DIkt5UZJAB
enableDatabase: true
enable_email: true
env:
  PHPIX_PHP_THREADS: "4"
jobs:
  - name: after_deploy
    trigger: post-deployment
    action:
      execute:
        command: after_deploy
annotations:
  anybuild.run/provider: laravel
  anybuild.run/version: 0.34.0
  anybuild.run/config:
    composer_build_script: post-update-cmd
    composer_enable: true
    name: out
    node_package_manager: npm
    npm_version: "11"
    php_framework: laravel
    php_public_dir: public
    phpix: true
  wasmer.io/version: 7.5.0
